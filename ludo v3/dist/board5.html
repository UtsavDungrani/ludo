<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5-Player Board</title>
    <link rel="icon" type="image/x-icon" href="../img/favico2.png" />
    <style>
      :root {
        --ink: #0f3d45;
        --cyan: #20a2b6;
        --wash: #9ca3af;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 28px 16px 48px;
        background: var(--wash);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #111827;
      }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
      .masthead {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      /* This page only draws the board for the geometry sliders - the playable
         game is game5.html, which is easy to miss when you land here first. */
      .play {
        padding: 7px 14px;
        border-radius: 9999px;
        background: #111827;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      .play:hover { background: #374151; }
      .hint { font-size: 12px; color: #374151; }
      .bar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; }
      input[type="range"] { max-width: 130px; }
      label { display: flex; align-items: center; gap: 7px; font-size: 14px; user-select: none; }
      .stage { width: min(88vw, 88vmin, 720px); aspect-ratio: 1; }
      svg { width: 100%; height: 100%; display: block; }
      .facts {
        display: flex; gap: 22px; flex-wrap: wrap; justify-content: center;
        font-size: 13px; color: #111827;
      }
      .facts b { font-variant-numeric: tabular-nums; }
      /* Design controls are for tuning the board, not for playing on it.
         They stay out of the DOM's way unless the page is opened as
         board5.html?design=1 - the inputs still exist, so draw() can read
         their defaults either way. */
      .design-only { display: none; }
      body.design .design-only { display: flex; }
    </style>
  </head>
  <body>
    <div class="masthead">
      <h1>5-Player Ludo Board</h1>
      <a class="play" href="game5.html">Play &rarr;</a>
    </div>
    <div class="hint">
      Board geometry only. The game, dice and debug tools live on
      <a href="game5.html">game5.html</a> (add <code>?debug=1</code> for the
      console tools). Add <code>?design=1</code> here for the sliders.
    </div>

    <div class="bar design-only">
      <label><input type="checkbox" id="toggle-guides" /> construction guides</label>
      <label>long edge <input type="range" id="arc" min="34" max="58" step="1" value="51" /> <span id="arc-val">51&deg;</span></label>
      <label>frame <input type="range" id="frame" min="0" max="60" step="1" value="0" /> <span id="frame-val">0</span></label>
      <label>white triangle <input type="range" id="pad" min="0" max="90" step="1" value="58" /> <span id="pad-val">band 32</span></label>
    </div>

    <div class="stage"><svg id="board"></svg></div>

    <div class="facts design-only">
      <span>points <b id="f-points">&mdash;</b></span>
      <span>long side <b id="f-long">&mdash;</b></span>
      <span>short side <b id="f-short">&mdash;</b></span>
      <span>ratio <b id="f-ratio">&mdash;</b></span>
      <span>cell <b id="f-cell">&mdash;</b></span>
    </div>

    <script type="module">
      import { CONFIG, describe, withSquareCells, cellSize } from "./js/board5-geometry.js";
      import { renderFrame, renderSkeleton, renderTrack, renderTokens } from "./js/board5-render.js";

      if (new URLSearchParams(location.search).get("design") === "1") {
        document.body.classList.add("design");
      }

      const svg = document.getElementById("board");
      const guides = document.getElementById("toggle-guides");
      const arc = document.getElementById("arc");
      const frame = document.getElementById("frame");
      const pad = document.getElementById("pad");

      function draw() {
        // withSquareCells derives armHalf / centerR so every track cell is
        // square, the way board/15 does on the 4-player boards.
        const cfg = withSquareCells({
          ...CONFIG,
          longArc: Number(arc.value),
          shortArc: 72 - Number(arc.value), // keeps 5 x (long + short) = 360
          frame: Number(frame.value),
          padInset: Number(pad.max) - Number(pad.value),
        });
        renderFrame(svg, cfg);
        renderSkeleton(svg, cfg);
        renderTrack(svg, cfg);
        renderTokens(svg, cfg);
        const gd = svg.querySelector("#guides");
        svg.appendChild(gd); // keep guides above the skeleton
        gd.setAttribute("opacity", guides.checked ? 1 : 0);

        const d = describe(cfg);
        document.getElementById("f-points").textContent = d.points;
        document.getElementById("f-long").textContent = d.longEdge.toFixed(0);
        document.getElementById("f-short").textContent = d.shortEdge.toFixed(0);
        document.getElementById("f-ratio").textContent = d.ratio.toFixed(2) + " : 1";
        const cs = cellSize(cfg);
        document.getElementById("f-cell").textContent = cs.across.toFixed(1) + " x " + cs.along.toFixed(1);
        document.getElementById("arc-val").textContent = arc.value + "°";
        document.getElementById("frame-val").textContent = frame.value;
        document.getElementById("pad-val").textContent = "band " + cfg.padInset;
      }

      [guides, arc, frame, pad].forEach((c) => c.addEventListener("input", draw));
      draw();
    </script>
  </body>
</html>
