<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5-Player Game Board</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="icon" type="image/x-icon" href="../img/favico2.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #9ca3af;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #111827;
      }
      .table {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 16px;
        min-height: 100vh;
      }
      /* The board is square, so sizing it on width alone lets it grow taller
         than the window and push the dice off the bottom. Height is part of the
         limit, and the panel's width is reserved before the board takes the
         rest. */
      .stage {
        flex: 0 1 auto;
        width: min(72vw, 92vh, 760px);
        aspect-ratio: 1;
      }
      #board { width: 100%; height: 100%; display: block; }

      /* main.css styles the 4-player board's div tokens. None of those
         properties mean anything on an SVG group, but they are turned off here
         so nothing can leak into this board. */
      #board .token {
        width: auto;
        height: auto;
        border: 0;
        background-image: none;
      }
      #board .token { transition: transform 150ms linear; }
      #board .selectable { cursor: pointer; }
      #board .selectable circle {
        stroke: #ffffff;
        stroke-dasharray: 7 6;
        animation: crawl 1.4s linear infinite;
      }
      @keyframes crawl { to { stroke-dashoffset: -26; } }

      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        min-width: 220px;
      }
      #currentPlayer {
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 700;
        background: #ef4444;
        color: #fff;
        text-align: center;
      }
      #rollButton,
      #resetButton {
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        font-weight: 700;
        color: #fff;
        background: #111827;
        cursor: pointer;
      }
      #rollButton:disabled { opacity: 0.45; cursor: default; }
      #resetButton { background: #4b5563; font-weight: 600; }

      #standings {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }
      #standings li { display: flex; align-items: center; gap: 8px; }
      .chip {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #111827;
        display: inline-block;
      }

      #flash {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%) translateY(-16px);
        background: rgba(17, 24, 39, 0.93);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        white-space: pre-line;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
        z-index: 1000;
      }
      #flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* Too narrow to sit side by side: stack, and lay the panel out in a row
         so the dice still lands above the fold. */
      @media (max-width: 860px) {
        .table { flex-direction: column; gap: 16px; min-height: 0; }
        .stage { width: min(94vw, 62vh, 620px); }
        .panel {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          gap: 14px;
        }
        #standings { flex-basis: 100%; align-items: center; }
      }
    </style>
  </head>
  <body>
    <div class="table">
      <div class="stage"><svg id="board"></svg></div>

      <div class="panel" id="dice_con">
        <div id="currentPlayer">Player Red's turn</div>

        <div id="dice" class="dice">
          <div class="face front" data-value="1" aria-label="1">
            <span class="pip"></span>
          </div>
          <div class="face back" data-value="2" aria-label="2">
            <span class="pip"></span><span class="pip"></span>
          </div>
          <div class="face left" data-value="3" aria-label="3">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
          <div class="face right" data-value="4" aria-label="4">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span>
          </div>
          <div class="face bottom" data-value="5" aria-label="5">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span><span class="pip"></span>
          </div>
          <div class="face top" data-value="6" aria-label="6">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
        </div>

        <button id="rollButton">Roll Dice</button>
        <ol id="standings"></ol>
        <button id="resetButton">New game</button>
      </div>
    </div>

    <script type="module" src="js/board5-game.js"></script>
  </body>
</html>
