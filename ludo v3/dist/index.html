<!doctype html>
<html lang="en" class="h-full bg-gray-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Game Setup</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="../img/favico2.png" />
  </head>
  <body class="h-full flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 p-8 bg-white shadow-lg rounded-lg">
      <form id="gameSetupForm" class="mt-8 space-y-6">
        <h2 class="text-3xl font-extrabold text-gray-900 text-center">
          Game Setup
        </h2>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Number of Players:</label
          >
          <div class="flex justify-between space-x-2">
            <button
              type="button"
              class="player-count-btn flex-1 py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              data-players="2"
            >
              2 Players
            </button>
            <button
              type="button"
              class="player-count-btn flex-1 py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              data-players="3"
            >
              3 Players
            </button>
            <button
              type="button"
              class="player-count-btn flex-1 py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              data-players="4"
            >
              4 Players
            </button>
          </div>
        </div>
        <div id="colorSelection" class="hidden space-y-4">
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Select Colors:</label
          >
          <div class="flex justify-between space-x-2">
            <button
              type="button"
              class="color-btn flex-1 py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
              data-colors="green,blue"
            >
              Green & Blue
            </button>
            <button
              type="button"
              class="color-btn flex-1 py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-gradient-to-r from-red-500 to-yellow-500 hover:from-red-600 hover:to-yellow-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
              data-colors="red,yellow"
            >
              Red & Yellow
            </button>
          </div>
        </div>
        <div id="playerNames" class="space-y-4 hidden">
          <!-- Player input fields will be dynamically added here -->
        </div>
        <div>
          <button
            type="submit"
            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
          >
            Start Game
          </button>
        </div>
      </form>
    </div>

    <script type="module" src="js/game-setup.js"></script>
  </body>
</html>
